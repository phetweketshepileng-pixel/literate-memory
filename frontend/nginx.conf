server {
  listen 8080;
  root /usr/share/nginx/html;

  # compress pages before sending: the app is ~4x smaller over mobile data
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;


  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  # the offline helper must always be checked for a newer version
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  # icons rarely change: let phones keep them for a month
  location ~* \.png$ { add_header Cache-Control "public, max-age=2592000"; }
  location = /healthz { return 200 "ok"; }
}
